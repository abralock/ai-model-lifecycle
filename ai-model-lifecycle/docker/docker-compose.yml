# AI Model Lifecycle — Gate 1 dev box database services
#
# Postgres is used by the R3/R4/R5 chained pipeline cases
# (Oracle SP -> PostgreSQL, bulk-load/optimize, ETL -> dashboard).
#
# Usage (from repo root):
#   docker compose -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.yml ps
#
# Credentials default to the dev-box values and can be overridden via a .env
# placed next to this file (compose auto-loads docker/.env). The repo-root
# .env holds the harness-side connection vars for the Python runner.

services:
  postgres:
    image: postgres:16
    container_name: aidb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aidb
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d aidb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - aidb_pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro

  # Optional MLflow server for browsing results (see MLFLOW.md). Only started
  # with `--profile mlflow`, so the default `up -d` still starts Postgres only.
  # Host port 5050, not 5000: macOS AirPlay Receiver already listens on 5000.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.0
    container_name: aidb-mlflow
    profiles: ["mlflow"]
    restart: unless-stopped
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts '*'
    ports:
      - "127.0.0.1:5050:5000"
    volumes:
      - aidb_mlflow:/mlflow

volumes:
  aidb_pgdata:
  aidb_mlflow:
