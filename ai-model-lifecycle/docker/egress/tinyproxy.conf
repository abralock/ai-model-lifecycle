# Allowlist forward proxy for the agent sandbox (see Dockerfile).
Port 8888
Listen 0.0.0.0
Timeout 900
MaxClients 200
# No LogFile and no Syslog: tinyproxy -d logs to stdout, which `docker logs`
# keeps; agentic.py reads it to record each attempt's allowed and refused hosts.
LogLevel Connect
DisableViaHeader Yes
# HTTPS (CONNECT) only to port 443; plain HTTP goes through the same filter.
ConnectPort 443
# Refuse every host that matches no line of the allowlist.
FilterDefaultDeny Yes
FilterType ere
FilterCaseSensitive No
Filter "/etc/tinyproxy/allowlist.txt"
