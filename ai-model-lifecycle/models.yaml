# models.yaml — Candidate model matrix for Gate 1 New Model Evaluation.
#
# Pair-agnostic structure: add more entries under `pairs:` and the harness,
# scorers and report pick them up with no code changes.
#
# `current` = incumbent model (baseline). `target` = candidate model (upgrade).
# Every pair has a stable `id` used as the runs/ subdirectory name.
#
# Gate 1 pilot ships with ONE pair (Opus 4.8 -> Opus 5.5). The remaining six
# pairs from GATE1_BUILD_PLAN.md §1 are listed commented-out so they can be
# enabled without touching Python.

pairs:
  - id: opus-4.8-vs-5.5
    current: {id: anthropic/claude-opus-4.8, name: "Claude Opus 4.8"}
    target:  {id: anthropic/claude-opus-5.5, name: "Claude Opus 5.5"}

# --- Remaining matrix (enable in later waves) -------------------------------
  - id: sonnet-5-vs-5.5
    current: {id: anthropic/claude-sonnet-5,   name: "Claude Sonnet 5"}
    target:  {id: anthropic/claude-sonnet-5.5, name: "Claude Sonnet 5.5"}
  - id: sonnet-4.6-vs-5.5
    current: {id: anthropic/claude-sonnet-4.6, name: "Claude Sonnet 4.6"}
    target:  {id: anthropic/claude-sonnet-5.5, name: "Claude Sonnet 5.5"}
