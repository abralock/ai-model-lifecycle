# --- Harness run defaults (shared across all pairs) -------------------------
defaults:
  temperature: 0
  max_tokens: 32000
  timeout_s: 600
  max_retries: 5
  backoff_base_s: 2      # exponential: base * 2**attempt, honoring Retry-After

# Cases enabled for the pilot. Each maps to a directory under cases/.
# (R2 GWT->Angular and the C/T suites are deferred — see TEST_CASES.md.)
cases:
  - r1_springboot2to3
  - r3_oracle_to_postgres
  - r4_schema_load_optimize
  - r5_etl_dashboard
