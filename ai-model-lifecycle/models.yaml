# models.yaml — Candidate model matrix for Gate 1 New Model Evaluation.
#
# Pair-agnostic structure: add more entries under `pairs:` and the harness,
# scorers and report pick them up with no code changes.
#
# `current` = incumbent model (baseline). `target` = candidate model (upgrade).
# Every pair has a stable `id` used as the runs/ subdirectory name.
#
# Gate 1 pilot ships with ONE pair (Opus 4.8 -> Opus 5.5). The remaining six
# pairs from GATE1_BUILD_PLAN.md §1 are listed commented-out so they can be
# enabled without touching Python.

pairs:
  - id: opus-4.8-vs-5.5
    current: {id: anthropic/claude-opus-4.8, name: "Claude Opus 4.8"}
    target:  {id: anthropic/claude-opus-5.5, name: "Claude Opus 5.5"}

# --- Remaining matrix (enable in later waves) -------------------------------
  - id: sonnet-5-vs-5.5
    current: {id: anthropic/claude-sonnet-5,   name: "Claude Sonnet 5"}
    target:  {id: anthropic/claude-sonnet-5.5, name: "Claude Sonnet 5.5"}
  - id: sonnet-4.6-vs-5.5
    current: {id: anthropic/claude-sonnet-4.6, name: "Claude Sonnet 4.6"}
    target:  {id: anthropic/claude-sonnet-5.5, name: "Claude Sonnet 5.5"}
  - id: haiku-4.5-vs-5.5
    current: {id: anthropic/claude-haiku-4.5,  name: "Claude Haiku 4.5"}
    target:  {id: anthropic/claude-haiku-5.5,  name: "Claude Haiku 5.5"}
#  (Before enabling a GPT pair, check which providers serve BOTH its models
#   (the /endpoints URL in `defaults.provider` below); if Amazon Bedrock
#   doesn't, set one per pair, e.g. provider: {order: ["OpenAI"], allow_fallbacks: false})
#  - id: gpt-5.6-sol-vs-6-sol
#    current: {id: openai/gpt-5.6-sol,   name: "GPT-5.6 Sol"}
#    target:  {id: openai/gpt-6-sol,     name: "GPT-6 Sol"}
#  (GPT-5.6 Luna -> GPT-6 Luna runs through OpenCode Go instead — see the
#   gpt-5.6-luna-vs-6-luna pair in the OpenCode Go section below.)
#  - id: gpt-5.6-terra-vs-6-terra
#    current: {id: openai/gpt-5.6-terra, name: "GPT-5.6 Terra"}
#    target:  {id: openai/gpt-6-terra,   name: "GPT-6 Terra"}

# --- OpenCode Go pairs (open-weight models) -----------------------------------
# Models with `api: opencode-go` are called through the OpenCode Go
# subscription (https://opencode.ai/v2/docs/console/go) instead of OpenRouter;
# the key goes in .env as OPENCODE_GO_API_KEY. No provider pinning: Go is
# already a single gateway, so both models of a pair share its infrastructure.
# Token prices for the scorecard come from pricing.py (Go's list prices —
# they count against the monthly quota; they are not marginal billing).
  - id: glm-5.2-vs-5.3
    # GLM-5.x on Go is thinking-ONLY (disabling thinking is rejected upstream,
    # probed 2026-10-14): left at its default it can burn the whole output
    # budget on hidden reasoning and return an empty answer (smoke run
    # 20261014T130723Z: 32k output tokens, finish_reason=length, no content).
    # reasoning_effort: low caps that; set on BOTH models to stay symmetric.
    # reasoning_content is returned separately and never graded as the answer.
    current: {id: glm-5.2, name: "GLM-5.2", api: opencode-go, params: {reasoning_effort: low}}
    target:  {id: glm-5.3, name: "GLM-5.3", api: opencode-go, params: {reasoning_effort: low}}
  - id: deepseek-v4.1-flash-vs-v4-pro
    current: {id: deepseek-v4.1-flash, name: "DeepSeek V4.1 Flash", api: opencode-go}
    target:  {id: deepseek-v4-pro,     name: "DeepSeek V4 Pro", api: opencode-go}
  # GPT Luna on Go is served ONLY over the OpenAI Responses API (endpoints
  # table at https://opencode.ai/v2/docs/console/go, checked 2026-10-15), so
  # this pair routes via the opencode-go-responses gateway (same base URL and
  # key as opencode-go, family: responses). Provider pinning does not apply —
  # Go is one gateway, both models share its infrastructure.
  - id: gpt-5.6-luna-vs-6-luna
    current: {id: gpt-5.6-luna, name: "GPT-5.6 Luna", api: opencode-go-responses}
    target:  {id: gpt-6-luna,   name: "GPT-6 Luna",   api: opencode-go-responses}
  # Cross-vendor flash comparison (current = Qwen, target = GLM). Qwen3.x on
  # Go is served ONLY over the Anthropic messages API (/v1/messages); GLM is
  # chat completions. A model-level `family: messages` override keeps both on
  # the opencode-go gateway, so the report's Provider line stays one gateway
  # (Go's infrastructure either way). GLM-5.x on Go is thinking-only — cap at
  # reasoning_effort: low; set on both to stay symmetric (dropped where the
  # messages route rejects it).
  - id: qwen3.8-flash-vs-glm-5.3-flash
    # Qwen via /messages thinks HEAVILY and ignores every thinking control
    # (probed 2026-10-15 on r3: budget_tokens=2000 -> 19.5k thinking tokens;
    # disabled -> 14.6k; none -> 19.2k; ~430-620s/call at ~35 tok/s). No param
    # helps, so none is sent; the 1200s timeout floor covers its slow calls
    # (the real suite's 1800s still wins). GLM keeps reasoning_effort: low —
    # GLM-5.x on Go is thinking-only and otherwise burns the output budget.
    timeout_s: 1200
    current: {id: qwen3.8-flash, name: "Qwen3.8 Flash", api: opencode-go, family: messages}
    target:  {id: glm-5.3-flash, name: "GLM-5.3 Flash", api: opencode-go, params: {reasoning_effort: low}}
#  Other chat-completions models on Go that work with no code change:
#  kimi-k2.7-code -> kimi-k3, glm-5.3-flash, longcat-2.0, mimo-v2.6-flash/-pro,
#  hy3, hy4-preview, space-bunny, and the free previews. Grok and Muse Spark
#  share Luna's Responses API (api: opencode-go-responses); MiniMax and
#  Qwen3.x share Qwen's Anthropic-messages dialect (family: messages override,
#  see the qwen3.8-flash-vs-glm-5.3-flash pair).

# --- Claude Code pairs (personal claude.ai subscription) ----------------------
# Same Claude models, called through the Claude Code CLI (`claude -p`, api:
# claude-code) on my own subscription instead of OpenRouter. Personal use only
# — see docs/CLAUDE_CODE_GATEWAY.md. Ids are Claude Code's (dashes), not
# OpenRouter slugs. A different measurement (Claude Code's own request, no
# temperature control, cost is Claude Code's estimate at API list prices), so
# these `-cc` scorecards are never compared with the OpenRouter ones.
  - id: opus-4.8-vs-5.5-cc
    current: {id: claude-opus-4-8,   name: "Claude Opus 4.8 (CC)",   api: claude-code}
    target:  {id: claude-opus-5-5,   name: "Claude Opus 5.5 (CC)",   api: claude-code}
  - id: sonnet-5-vs-5.5-cc
    current: {id: claude-sonnet-5,   name: "Claude Sonnet 5 (CC)",   api: claude-code}
    target:  {id: claude-sonnet-5-5, name: "Claude Sonnet 5.5 (CC)", api: claude-code}
  - id: sonnet-4.6-vs-5.5-cc
    current: {id: claude-sonnet-4-6, name: "Claude Sonnet 4.6 (CC)", api: claude-code}
    target:  {id: claude-sonnet-5-5, name: "Claude Sonnet 5.5 (CC)", api: claude-code}
  - id: haiku-4.5-vs-5.5-cc
    current: {id: claude-haiku-4-5,  name: "Claude Haiku 4.5 (CC)",  api: claude-code}
    target:  {id: claude-haiku-5-5,  name: "Claude Haiku 5.5 (CC)",  api: claude-code}

# --- Cross-gateway pairs: closed-weight vs open-weight -------------------------
# A closed-weight Claude model on the claude.ai subscription (api:
# claude-code) vs an open-weight model on the OpenCode Go subscription
# (api: opencode-go) — same tasks, same scorers. Quality is
# like-for-like; Time and Cost compare each model ON ITS OWN ROUTE (two
# subscriptions with different cost bases: Claude Code's estimate at API list
# prices vs Go list prices from pricing.py), and the scorecard says so instead
# of warning about mixed providers. Needs both sides ready: `claude auth
# status` logged in via claude.ai AND OPENCODE_GO_API_KEY in .env. A Claude
# Code usage limit stops the run (exit 3, partial run kept); a Go 429 is an
# infra error. Thinking is asymmetric by nature here: GLM-5.x on Go is
# thinking-ONLY and needs reasoning_effort: low or it burns the output budget
# (see glm-5.2-vs-5.3); the Claude side keeps Claude Code's default.
  - id: opus-5.5-cc-vs-glm-5.3
    current: {id: claude-opus-5-5, name: "Claude Opus 5.5 (CC)", api: claude-code}
    target:  {id: glm-5.3, name: "GLM-5.3", api: opencode-go, params: {reasoning_effort: low}}
  # Qwen3.8 Flash on Go is served ONLY over the Anthropic messages API
  # (family: messages, same as the qwen3.8-flash-vs-glm-5.3-flash pair) and
  # thinks heavily while ignoring every thinking control, so no params are
  # sent and the pair needs a timeout floor well above the 600s default.
  # 1200s was not enough: sanity run 20261023T020627Z lost two Qwen calls
  # (r3/r4 first repeats) to client timeouts at exactly 1200s, so the floor
  # matches the real suite's 1800s (which still applies there, with its 32k
  # qwen output cap).
  - id: opus-5.5-cc-vs-qwen3.8-flash
    timeout_s: 1800
    current: {id: claude-opus-5-5, name: "Claude Opus 5.5 (CC)", api: claude-code}
    target:  {id: qwen3.8-flash, name: "Qwen3.8 Flash", api: opencode-go, family: messages}
  # Mid-tier matched pair: the recommended closed upgrade (Sonnet 5.5) vs
  # DeepSeek V4 Pro on Go's default chat family (no thinking params needed,
  # unlike GLM; see deepseek-v4.1-flash-vs-v4-pro for the model's Go entry).
  - id: sonnet-5.5-cc-vs-deepseek-v4-pro
    current: {id: claude-sonnet-5-5, name: "Claude Sonnet 5.5 (CC)", api: claude-code}
    target:  {id: deepseek-v4-pro, name: "DeepSeek V4 Pro", api: opencode-go}
# Matched-capability pair that works the same way with no code change (enable
# when there's budget to run it): claude-haiku-5-5 vs glm-5.3-flash
# (small vs small).

# --- Harness run defaults (shared across all pairs) -------------------------
defaults:
  # OpenRouter provider routing, sent on every call. Pin ONE provider with
  # fallbacks off so both models of a pair run on the same infrastructure;
  # otherwise OpenRouter picks per request and the Time axis measures provider
  # speed. Amazon Bedrock serves all 7 Claude models (checked 2026-10-09 via
  # https://openrouter.ai/api/v1/models/<model>/endpoints). Override per pair
  # with `provider: {...}` (e.g. GPT pairs), or `provider: null` to let
  # OpenRouter route freely.
  provider:
    order: ["Amazon Bedrock"]
    allow_fallbacks: false
  temperature: 0
  max_tokens: 32000
  timeout_s: 600
  max_retries: 5
  backoff_base_s: 2      # exponential: base * 2**attempt, honoring Retry-After

# --- Non-OpenRouter gateways ---------------------------------------------------
# A model with `api: <name>` is called through that gateway instead of
# OpenRouter. Families wired up in runner.py: `chat` (OpenAI-compatible chat
# completions, litellm `openai/` + base_url), `responses` (OpenAI Responses
# API), `messages` (Anthropic messages API) and `claude-code` (the Claude Code
# CLI on the personal subscription).
apis:
  opencode-go:
    # OpenCode Go subscription: https://opencode.ai/v2/docs/console/go
    # Get the key: opencode.ai/console -> subscribe to Go/Go Plus -> copy the
    # API key (or create a service account key) -> .env OPENCODE_GO_API_KEY.
    base_url: https://opencode.ai/inference/go/v1
    api_key_env: OPENCODE_GO_API_KEY
    family: chat
  opencode-go-responses:
    # Same Go subscription and base URL for models Go serves only over the
    # OpenAI Responses API (GPT Luna, Grok, Muse Spark per the docs endpoints
    # table, checked 2026-10-15).
    base_url: https://opencode.ai/inference/go/v1
    api_key_env: OPENCODE_GO_API_KEY
    family: responses
  claude-code:
    # Claude Code CLI (`claude -p`) on my own claude.ai subscription. Personal use
    # only — see docs/CLAUDE_CODE_GATEWAY.md. No base_url or key: the CLI's own login.
    family: claude-code

# Cases enabled for the pilot. Each maps to a directory under cases/.
# (R2 GWT->Angular and the C/T suites are deferred — see TEST_CASES.md.)
cases:
  - r1_springboot2to3
  - r3_oracle_to_postgres
  - r4_schema_load_optimize
  - r5_etl_dashboard

# Other case suites, picked with `--suite <name>` (runner.py / report.py).
# Each suite's keys other than `cases` override `defaults` for its runs; its
# scorecard is runs/<pair>/REPORT.<name>.md.
suites:
  # Real open-source projects (whole codebase in the prompt, ~50-120k tokens).
  real:
    # Output limit per call, thinking included. 32k cut answers short (Haiku
    # 5.5 used 28.9k on r2 alone), and at 64k Sonnet 5.5 thought through the
    # whole limit on all three r1b answers (run 20261013T081118Z). So: 128k,
    # the most every model allows on Bedrock except Haiku 4.5 (64k).
    max_tokens: 128000
    max_tokens_by_model:
      anthropic/claude-haiku-4.5: 64000
      # Qwen3.8 Flash on Go's messages route thinks until the budget is gone:
      # at 64k/128k Go's upstream kills the call ("Endpoint is unavailable"
      # after ~22 min, probed 2026-10-15); at 32k it completes — on r1b as
      # finish=length (30.8k of 32k spent thinking), i.e. the model cannot
      # finish r1b on this route. 32k is the only completable setting.
      qwen3.8-flash: 32000
    timeout_s: 1800        # a 128k answer takes ~15-18 min at ~120 tokens/s
    # Thinking (hidden reasoning) shares max_tokens with the answer. By default
    # Sonnet 5 thought through all 64k on r1b and answered nothing, or only part
    # (run 20261013T062754Z). A thinking budget ({max_tokens: 16000}) was not
    # enforced: Sonnet 5 thought 35k, Sonnet 5.5 all 64k (run 20261013T065621Z).
    # So every model gets the same effort level instead. Sent as OpenRouter's
    # `reasoning` parameter; it also turns thinking ON for models that do not
    # think by default.
    reasoning: {effort: medium}
    cases:
      - r1b_jhipster_boot3
      - r2_gwt_to_angular
